version: '3.8'

services:
  mongodb:
    image: mongo:6.0
    container_name: pulse-mongodb
    restart: unless-stopped
    environment:
      MONGO_INITDB_DATABASE: project_management
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    networks:
      - pulse-network

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: pulse-backend
    restart: unless-stopped
    ports:
      - "5000:5000"
    environment:
      PORT: 5000
      MONGODB_URI: mongodb://mongodb:27017/project_management
      JWT_SECRET: production_jwt_secret_pulse_2026_super_secure
      JWT_EXPIRES_IN: 7d
      CLIENT_URL: http://localhost:8080
      NODE_ENV: production
    depends_on:
      - mongodb
    networks:
      - pulse-network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: pulse-frontend
    restart: unless-stopped
    ports:
      - "8080:80"
    depends_on:
      - backend
    networks:
      - pulse-network

volumes:
  mongo_data:
    driver: local

networks:
  pulse-network:
    driver: bridge
