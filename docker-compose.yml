version: '3.8'

services:
  mysql:
    image: mysql:8.0
    container_name: pulse-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: pulse_root_password_2026
      MYSQL_DATABASE: project_management
      MYSQL_USER: pulse_user
      MYSQL_PASSWORD: pulse_password_2026
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    networks:
      - pulse-network
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "pulse_user", "-ppulse_password_2026"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: pulse-backend
    restart: unless-stopped
    ports:
      - "5000:5000"
    environment:
      PORT: 5000
      DB_HOST: mysql
      DB_PORT: 3306
      DB_NAME: project_management
      DB_USER: pulse_user
      DB_PASSWORD: pulse_password_2026
      JWT_SECRET: production_jwt_secret_pulse_2026_super_secure
      JWT_EXPIRES_IN: 7d
      CLIENT_URL: http://localhost:8080
      NODE_ENV: production
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      - pulse-network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: pulse-frontend
    restart: unless-stopped
    ports:
      - "8080:80"
    depends_on:
      - backend
    networks:
      - pulse-network

volumes:
  mysql_data:
    driver: local

networks:
  pulse-network:
    driver: bridge
